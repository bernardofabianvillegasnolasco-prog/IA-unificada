<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>IA BF v31</title>
<style>
body{background:#000;color:#00ff88;font-family:monospace;padding:12px}
.DI{text-align:center;font-size:52px;font-weight:900;text-shadow:0 0 30px #ff0033;color:#fff;letter-spacing:6px}
.sub{color:#00ff88;text-align:center;font-size:11px;margin-bottom:12px}
.box{border:1px solid #222;border-radius:16px;padding:10px;margin:8px 0;background:#0a0a0a}
.btn-3d-responder{
width:100%;padding:18px 0;border:none;border-radius:22px;
background:linear-gradient(180deg,#ff3344 0%,#cc0011 50%,#88000a 100%);
color:#fff;font-weight:900;font-size:20px;letter-spacing:4px;
text-shadow:0 1px 2px rgba(0,0,0,0.8),0 0 8px rgba(255,255,255,0.5);
box-shadow:0 8px 0 #550007,0 12px 20px rgba(255,0,51,0.5),inset 0 2px 0 rgba(255,255,255,0.3),inset 0 -2px 0 rgba(0,0,0,0.4);
transform:translateY(0);transition:all .12s ease;cursor:pointer;
}
.btn-3d-responder:active{transform:translateY(6px);box-shadow:0 2px 0 #550007,0 4px 10px rgba(255,0,51,0.5),inset 0 1px 0 rgba(255,255,255,0.3)}
.btn{width:100%;background:#00ff88;color:#000;border:none;border-radius:12px;padding:12px;font-weight:900;margin:4px 0}
.small{font-size:10px;opacity:.5;text-align:center}
#chat{max-height:50vh;overflow-y:auto}
</style>
</head>
<body>
<div class="DI">IA BF</div>
<div class="sub">IA BF UNIVERSAL v31 • 13 MOTORES + MEMORIA • Creado por BF Villegas</div>
<div id="chat"></div>
<div class="box">
<textarea id="prompt" rows="2" style="width:100%;background:#111;color:#00ff88;border:1px solid #333;border-radius:10px;padding:10px"></textarea>
<button class="btn" id="btnMic">🎤 HABLAR</button>
<button class="btn-3d-responder" id="btnResponder">RESPONDER</button>
<div style="display:flex;gap:6px"><button class="btn" id="btnVoz">🔊 VOZ ON</button><button class="btn" id="btnBorrar">🗑 BORRAR</button></div>
</div>
<div class="small">Historial guardado local • Creado por BF Villegas • ia-unificada-bf.vercel.app • v31 DIOS</div>
<script>
let historial=JSON.parse(localStorage.getItem('bf_v31_hist')||'[]');
let vozActiva=true;
const chatEl=document.getElementById('chat'),promptEl=document.getElementById('prompt');
const btnEl=document.getElementById('btnResponder'),btnMic=document.getElementById('btnMic'),btnVoz=document.getElementById('btnVoz');
function render(){chatEl.innerHTML='';historial.slice(-20).forEach(m=>{const d=document.createElement('div');d.style.margin='6px 0';d.style.padding='8px';d.style.borderRadius='10px';d.style.border='1px solid #333';d.textContent=m.content;chatEl.appendChild(d);});chatEl.scrollTop=chatEl.scrollHeight;}
function hablar(t){if(!vozActiva)return;speechSynthesis.cancel();const u=new SpeechSynthesisUtterance(t);u.lang='es-MX';speechSynthesis.speak(u);}
async function responder(){const p=promptEl.value.trim();if(!p)return;btnEl.textContent='PENSANDO...';historial.push({role:'user',content:p});localStorage.setItem('bf_v31_hist',JSON.stringify(historial));render();promptEl.value='';try{const r=await fetch('/api/cerebro',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({prompt:p,historial:historial.slice(-10)})});const j=await r.json();historial.push({role:'assistant',content:j.text});hablar(j.text);}catch(e){historial.push({role:'assistant',content:'Error:'+e.message});}localStorage.setItem('bf_v31_hist',JSON.stringify(historial));render();btnEl.textContent='RESPONDER';}
btnEl.onclick=responder;promptEl.addEventListener('keydown',e=>{if(e.key==='Enter'&&!e.shiftKey){e.preventDefault();responder();}});
document.getElementById('btnBorrar').onclick=()=>{historial=[];localStorage.removeItem('bf_v31_hist');render();};
btnVoz.onclick=()=>{vozActiva=!vozActiva;btnVoz.textContent=vozActiva?'🔊 VOZ ON':'🔇 VOZ OFF';};
let rec=null;btnMic.onclick=()=>{const SR=window.SpeechRecognition||window.webkitSpeechRecognition;if(!SR){alert('Usa Chrome');return;}if(rec&&rec._on){rec.stop();return;}rec=new SR();rec.lang='es-MX';rec._on=true;rec.onstart=()=>{btnMic.textContent='🎙️ ESCUCHANDO...';};rec.onend=()=>{btnMic.textContent='🎤 HABLAR';rec._on=false;};rec.onresult=(e)=>{promptEl.value=e.results[0][0].transcript;responder();};rec.start();};
render();
</script>
</body>
</html>
