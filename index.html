<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>IA BF v31</title>
<link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@700;900&family=Black+Ops+One&display=swap" rel="stylesheet">
<style>
body{margin:0;background:#000;color:#00ff88;font-family:monospace;padding:12px;padding-top:46px;overflow-x:hidden}
#reloj{position:fixed;top:8px;right:12px;z-index:9999;font-family:'Orbitron',monospace;text-align:right;background:rgba(0,0,0,0.8);border:1px solid #333;border-radius:8px;padding:5px 10px}
#fecha{font-size:10px;color:#fff}
#hora{font-size:13px;color:#fff;font-weight:900;letter-spacing:2px;margin-top:2px}
#btnAjustes{position:fixed;top:8px;left:12px;z-index:9999;background:#111;border:1px solid #333;color:#fff;border-radius:8px;padding:6px 10px;font-size:16px}
#panelAjustes{position:fixed;top:48px;left:12px;z-index:10000;background:#111;border:1px solid #333;border-radius:14px;padding:12px;width:200px;display:none}
#panelAjustes.show{display:block}
.opcion{width:100%;background:#0a0a0a;color:#fff;border:1px solid #333;border-radius:10px;padding:10px;margin:6px 0;font-size:12px;cursor:pointer}

/* SOLO ESTA PARTE SE MUEVE - IGUAL A TU FOTO */
.DI{
 text-align:center;
 margin:12px 0 4px 0;
 line-height:1;
}
.DI span{
 font-family:'Black Ops One', sans-serif;
 font-size:64px;
 font-weight:400;
 letter-spacing:18px;
 color:#ffffff;
 display:inline-block;
 /* Brillo azul como tu foto */
 text-shadow:
  0 0 8px #00aaff,
  0 0 18px #00aaff,
  0 0 35px #0099ff,
  0 0 60px rgba(0,170,255,0.5);
 /* SOLO ESTO SE MUEVE */
 transform: translateZ(0);
 animation: moverSoloIABF 2.2s ease-in-out infinite;
 will-change: transform;
}
@keyframes moverSoloIABF{
 0%,100%{transform: translateZ(0) scale(1)}
 15%{transform: translateZ(0) scale(1.08)}
 30%{transform: translateZ(0) scale(1)}
 45%{transform: translateZ(0) scale(1.08)}
 70%{transform: translateZ(0) scale(1)}
}

/* TODO LO DEMAS INMOVIL */
.sub,.box,.btn,.btn-3d-responder,.small,#chat,#reloj,#btnAjustes{animation:none !important; transform:none !important}

.sub{color:#00ff88;text-align:center;font-size:10px;margin-bottom:12px;letter-spacing:2px;opacity:0.7}
.box{border:1px solid #222;border-radius:16px;padding:10px;margin:8px 0;background:#0a0a0a}
.btn-3d-responder{width:100%;padding:18px 0;border:none;border-radius:22px;background:linear-gradient(180deg,#ff3344 0%,#cc0011 50%,#88000a 100%);color:#fff;font-weight:900;font-size:22px;letter-spacing:5px;box-shadow:0 8px 0 #550007,0 12px 20px rgba(255,0,51,0.4);cursor:pointer}
.btn{width:100%;background:#00ff88;color:#000;border:none;border-radius:12px;padding:12px;font-weight:900;margin:4px 0}
.small{font-size:9px;opacity:.4;text-align:center;margin-top:16px}
#chat{max-height:50vh;overflow-y:auto}
.msg{margin:8px 0;padding:12px;border-radius:14px;border:1px solid #333;white-space:pre-wrap}
.user{background:linear-gradient(135deg,#00ff88,#00cc66);color:#000}
.ai{background:#111;color:#00ff88;border-left:3px solid #ff0033}
textarea{width:100%;background:#111;color:#00ff88;border:1px solid #333;border-radius:10px;padding:10px}
</style>
</head>
<body>
<button id="btnAjustes">⚙️</button>
<div id="panelAjustes"><div style="font-size:10px;color:#888;margin-bottom:8px">AJUSTES IA BF</div><button class="opcion" id="optVoz">🔊 Voz: ON</button><button class="opcion" id="optTest">🔈 Probar voz</button><button class="opcion" id="optBorrar">🗑️ Borrar memoria</button><button class="opcion" id="optCerrar">✖️ Cerrar</button></div>
<div id="reloj"><div id="fecha">25/10/2026</div><div id="hora">00:00:00</div></div>

<div class="DI"><span>IA BF</span></div>

<div class="sub">IA BF UNIVERSAL v31 • Creado por BF Villegas</div>
<div id="chat"></div>
<div class="box"><textarea id="prompt" rows="2" placeholder="Pregunta"></textarea><button class="btn" id="btnMic">🎤 HABLAR</button><button class="btn-3d-responder" id="btnResponder">RESPONDER</button></div>
<div class="small">Solo IA BF se mueve • estilo foto azul</div>

<script>
function actualizarReloj(){const a=new Date();document.getElementById('fecha').textContent=`${String(a.getDate()).padStart(2,'0')}/${String(a.getMonth()+1).padStart(2,'0')}/${a.getFullYear()}`;document.getElementById('hora').textContent=`${String(a.getHours()).padStart(2,'0')}:${String(a.getMinutes()).padStart(2,'0')}:${String(a.getSeconds()).padStart(2,'0')}`;}
setInterval(actualizarReloj,1000);actualizarReloj();
const btnAjustes=document.getElementById('btnAjustes'),panel=document.getElementById('panelAjustes');
btnAjustes.onclick=()=>panel.classList.toggle('show');
document.getElementById('optCerrar').onclick=()=>panel.classList.remove('show');
let historial=JSON.parse(localStorage.getItem('bf_v31_hist')||'[]');
let vozActiva=localStorage.getItem('bf_voz')!=='off';
let voces=[];function cargarVoces(){voces=speechSynthesis.getVoices();}speechSynthesis.onvoiceschanged=cargarVoces;cargarVoces();setTimeout(cargarVoces,500);
function limpiarParaVoz(t){return t.replace(/\r/g,'').replace(/\n+/g,', ').replace(/\*\*/g,' ').replace(/\*/g,' ').replace(/#/g,' ').replace(/`/g,' ').replace(/_/g,'').replace(/\s+/g,' ').trim();}
function hablar(t){if(!vozActiva)return;speechSynthesis.cancel();speechSynthesis.resume();const l=limpiarParaVoz(t).slice(0,500);if(!l)return;const u=new SpeechSynthesisUtterance(l);const v=voces.find(x=>x.lang.includes('es-MX'))||voces.find(x=>x.lang.includes('es'))||voces[0];if(v)u.voice=v;u.lang='es-MX';u.volume=1;u.rate=1;u.pitch=1;speechSynthesis.speak(u);}
const chatEl=document.getElementById('chat'),promptEl=document.getElementById('prompt'),btnEl=document.getElementById('btnResponder'),btnMic=document.getElementById('btnMic'),optVoz=document.getElementById('optVoz');
function actualizarVozUI(){optVoz.textContent=vozActiva?'🔊 Voz: ON':'🔇 Voz: OFF';}actualizarVozUI();
function renderActual(u,a){chatEl.innerHTML='';if(u){const d=document.createElement('div');d.className='msg user';d.textContent=u;chatEl.appendChild(d);}if(a){const d=document.createElement('div');d.className='msg ai';d.textContent=a;chatEl.appendChild(d);}}
async function responder(){
 const p=promptEl.value.trim();if(!p)return;
 chatEl.innerHTML='<div class="msg user">'+p+'</div><div class="msg ai" style="opacity:0.6">🧠 Pensando...</div>';
 btnEl.textContent='PENSANDO...';
 historial.push({role:'user',content:p});if(historial.length>100)historial=historial.slice(-100);localStorage.setItem('bf_v31_hist',JSON.stringify(historial));
 promptEl.value='';
 try{
  const r=await fetch('/api/cerebro',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({prompt:p,historial:historial.slice(-100)})});
  const j=await r.json();historial.push({role:'assistant',content:j.text});if(historial.length>100)historial=historial.slice(-100);localStorage.setItem('bf_v31_hist',JSON.stringify(historial));
  renderActual(p,j.text);hablar(j.text);
 }catch(e){renderActual(p,'Error:'+e.message);}
 btnEl.textContent='RESPONDER';
}
btnEl.onclick=()=>{speechSynthesis.resume();responder();};
promptEl.addEventListener('keydown',e=>{if(e.key==='Enter'&&!e.shiftKey){e.preventDefault();speechSynthesis.resume();responder();}});
optVoz.onclick=()=>{vozActiva=!vozActiva;localStorage.setItem('bf_voz',vozActiva?'on':'off');actualizarVozUI();if(vozActiva)hablar('Voz activada, soy IA BF');else speechSynthesis.cancel();};
document.getElementById('optTest').onclick=()=>{vozActiva=true;localStorage.setItem('bf_voz','on');actualizarVozUI();cargarVoces();hablar('Hola, soy IA BF');};
document.getElementById('optBorrar').onclick=()=>{if(confirm('¿Borrar memoria?')){historial=[];localStorage.removeItem('bf_v31_hist');chatEl.innerHTML='';panel.classList.remove('show');}};
let rec=null;btnMic.onclick=()=>{speechSynthesis.resume();const SR=window.SpeechRecognition||window.webkitSpeechRecognition;if(!SR){alert('Usa Chrome');return;}if(rec&&rec._on){rec.stop();return;}rec=new SR();rec.lang='es-MX';rec._on=true;rec.onstart=()=>{btnMic.textContent='🎙️ ESCUCHANDO...';};rec.onend=()=>{btnMic.textContent='🎤 HABLAR';rec._on=false;};rec.onresult=(e)=>{promptEl.value=e.results[0][0].transcript;responder();};rec.start();};
document.body.addEventListener('click',()=>{speechSynthesis.resume();},{once:true});
</script>
</body>
</html>
