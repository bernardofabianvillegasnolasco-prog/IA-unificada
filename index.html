<!DOCTYPE html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>BF v30 UNIFICADO</title></head><body style="background:#000;color:#0f8;font-family:monospace;padding:20px;text-align:center"><h1 style="font-size:70px;background:linear-gradient(#0ff,#0f8);-webkit-background-clip:text;-webkit-text-fill-color:transparent">BF</h1><h2>IA BF UNIVERSAL v30 - CEREBRO UNIFICADO - 13 EN 1 - SIN LOCALHOST</h2><p style="border:1px solid #0f8;padding:12px;border-radius:12px;margin:20px 0">🧠 CEREBRO UNICO - 13 MOTORES FUSIONADOS - INDEPENDIENTE DE LOCALHOST</p><textarea id="q" style="width:100%;background:#111;color:#0f8;padding:16px;border-radius:12px;min-height:100px" placeholder="Pregunta..."></textarea><br><button onclick="responder()" style="width:100%;background:#0f8;color:#000;padding:18px;border:none;border-radius:12px;font-weight:900;margin-top:12px">RESPONDER - CEREBRO UNIFICADO</button><div id="out" style="border:1px solid #0f8;padding:14px;margin-top:16px;min-height:200px;text-align:left;white-space:pre-wrap">v30 LISTO</div><script>async function responder(){const p=document.getElementById("q").value;const o=document.getElementById("out");o.textContent="Pensando...\n"+p;const r=await fetch("/api/cerebro",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({prompt:p})});const d=await r.json();o.textContent=d.cerebro+"\n\n"+d.text}</script></body></html>
