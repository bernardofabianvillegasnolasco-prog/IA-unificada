<!DOCTYPE html>
<html lang="es"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>IA BF UNIVERSAL v17</title>
<style>body{background:#000;color:#fff;font-family:system-ui;display:flex;flex-direction:column;align-items:center;padding:16px;min-height:100vh}.logo{width:80px;height:80px;border-radius:50%;background:linear-gradient(135deg,#00ff88,#00aaff);display:flex;align-items:center;justify-content:center;color:#000;font-weight:900;font-size:28px;box-shadow:0 0 30px #00ff88;margin:20px 0 10px}h1{font-size:28px;font-weight:900;background:linear-gradient(90deg,#00ff88,#00aaff);-webkit-background-clip:text;-webkit-text-fill-color:transparent}.box{width:100%;max-width:720px;display:flex;gap:6px;margin:14px 0;flex-wrap:wrap}input{flex:1;min-width:180px;padding:14px 16px;border-radius:14px;border:1px solid #222;background:#111;color:#fff;font-size:14px}button{padding:14px 16px;border-radius:14px;border:0;background:#00ff88;color:#000;font-weight:800;cursor:pointer}button.sec{background:#1a1a1a;color:#fff;border:1px solid #333}.card{width:100%;max-width:720px;background:#111;border:1px solid #1e1e1e;border-radius:14px;padding:14px;line-height:1.6;white-space:pre-wrap;word-break:break-all}#reader{width:100%;max-width:720px;margin:10px 0;border-radius:14px;overflow:hidden}.actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}.hist{width:100%;max-width:720px;margin-top:18px}.hist h3{color:#00ff88;font-size:14px;margin:8px 0}.hist-item{background:#0a0a0a;border:1px solid #1a1a1a;padding:8px 12px;border-radius:10px;margin:4px 0;font-size:12px;display:flex;justify-content:space-between;gap:8px;cursor:pointer}</style>
</head><body>
<div class="logo">BF</div><h1>IA BF UNIVERSAL v17</h1>
<div class="box">
<input id="p" placeholder="pregunta lo que quieras - busca en internet" onkeypress="if(event.key==='Enter') go()">
<button onclick="go()">Responder</button>
<button class="sec" onclick="hablar()">🎤</button>
<button class="sec" onclick="leer()">🔊</button>
<button class="sec" onclick="scanQR()">📷 QR</button>
</div>
<div id="reader"></div>
<div style="display:flex;gap:8px;flex-wrap:wrap;justify-content:center;margin-bottom:12px">
<label style="font-size:12px;color:#888">📸 Foto/QR: <input type="file" id="file" accept="image/*"></label>
<label style="font-size:12px;color:#888">📷 Camara: <button class="sec" onclick="scanQR()">Iniciar</button> <button class="sec" onclick="stopQR()">Detener</button></label>
</div>
<div id="result"></div>
<div class="hist" id="hist"></div>
<script src="https://unpkg.com/html5-qrcode@2.3.8/html5-qrcode.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/tesseract.js@5/dist/tesseract.min.js"></script>
<script>
let html5QrCode;let ultima="";let historial=JSON.parse(localStorage.getItem('bf_hist')||'[]');
function renderHist(){const h=document.getElementById('hist'); if(!historial.length){h.innerHTML='';return;} h.innerHTML='<h3>📜 Historial</h3>'+historial.slice(-10).reverse().map((x,i)=>`<div class="hist-item" onclick="document.getElementById('p').value='${x.q.replace(/'/g,"\\'")}';go()"><span>${x.q.slice(0,40)}</span><span style="color:#00ff88">${(x.a||'').slice(0,30)}</span></div>`).join('')+`<div style="margin-top:6px"><button class="sec" onclick="localStorage.removeItem('bf_hist');historial=[];renderHist()">🗑️ Borrar historial</button></div>`;}
renderHist();
function limpiar(t){return t.replace(/\*\*/g,"").trim();}
function plantillaResultado(texto){return `<div class="card">${texto}<div class="actions"><button class="sec" onclick="leer()">🔊 Escuchar</button><button class="sec" onclick="copiar()">📋 Copiar</button><button class="sec" onclick="compartir()">📤 Compartir</button></div></div>`;}
function mathNatural(v){
  let t=v.toLowerCase().replace(/,/g,'').trim();
  let m=t.match(/ra[ií]z cuadrada de\s*([\d\.]+)/); if(m){const n=parseFloat(m[1]); const r=Math.sqrt(n); return `✅ Raíz cuadrada de ${n} = ${r}`;}
  m=t.match(/ra[ií]z cuadrada\s*([\d\.]+)/); if(m){return `✅ Raíz cuadrada de ${parseFloat(m[1])} = ${Math.sqrt(parseFloat(m[1]))}`;}
  m=t.match(/(\d+(\.\d+)?)\s*%\s*de\s*(\d+(\.\d+)?)/); if(m){return `✅ ${m[1]}% de ${m[3]} = ${(parseFloat(m[1])/100)*parseFloat(m[3])}`;}
  m=t.match(/(\d+(\.\d+)?)\s*\^\s*(\d+(\.\d+)?)/); if(m){return `✅ ${m[1]}^${m[3]} = ${Math.pow(parseFloat(m[1]),parseFloat(m[3]))}`;}
  if(/^[\d\s\+\-\*\/\(\)\.\,]+$/.test(t) && /[\+\-\*\/\^]/.test(t) && t.length<35){try{const r=Function('"use strict";return ('+t.replace(/\^/g,'**')+')')(); if(!isNaN(r) && isFinite(r)) return `✅ ${v} = ${r}`;}catch(e){}}
  return null;
}
function saveHist(q,a){historial.push({q,a: (a+'').slice(0,80), t:Date.now()}); if(historial.length>50) historial=historial.slice(-50); localStorage.setItem('bf_hist',JSON.stringify(historial)); renderHist();}
function go(){
  const v=document.getElementById('p').value.trim(); if(!v) return;
  const math=mathNatural(v); if(math){document.getElementById('result').innerHTML=plantillaResultado(math); ultima=math.replace(/<[^>]+>/g,''); saveHist(v,ultima); return;}
  const r=document.getElementById('result'); r.innerHTML='<div class="card">🌐 Buscando en internet...</div>';
  fetch('/api/debate',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({prompt:v})}).then(x=>x.json()).then(d=>{ultima=d.respuesta||d.x2?.[0]?.respuesta||"Sin respuesta"; r.innerHTML=plantillaResultado(ultima); saveHist(v,ultima);}).catch(e=>{r.innerHTML=`<div class="card">Error: ${e.message}</div>`;});
}
function hablar(){const SR=window.SpeechRecognition||window.webkitSpeechRecognition;if(!SR){alert("No soporta voz");return;}const rec=new SR();rec.lang='es-MX';rec.onresult=e=>{document.getElementById('p').value=e.results[0][0].transcript;go();};rec.start();}
function leer(){if(!ultima) return;const u=new SpeechSynthesisUtterance(limpiar(ultima));u.lang='es-MX';u.rate=0.95;speechSynthesis.cancel();speechSynthesis.speak(u);}
function copiar(){if(!ultima) return; navigator.clipboard.writeText(ultima).then(()=>alert("✅ Copiado")).catch(()=>{const ta=document.createElement('textarea');ta.value=ultima;document.body.appendChild(ta);ta.select();document.execCommand('copy');ta.remove();alert("✅ Copiado");});}
async function compartir(){if(!ultima) return; if(navigator.share){try{await navigator.share({title:'IA BF UNIVERSAL', text:ultima});}catch(e){}} else{ copiar(); }}
function scanQR(){html5QrCode=new Html5Qrcode("reader");html5QrCode.start({facingMode:"environment"},{fps:10,qrbox:280,formatsToSupport:[Html5QrcodeSupportedFormats.QR_CODE,Html5QrcodeSupportedFormats.AZTEC,Html5QrcodeSupportedFormats.CODE_128,Html5QrcodeSupportedFormats.CODE_39,Html5QrcodeSupportedFormats.EAN_13,Html5QrcodeSupportedFormats.EAN_8,Html5QrcodeSupportedFormats.UPC_A,Html5QrcodeSupportedFormats.DATA_MATRIX,Html5QrcodeSupportedFormats.PDF_417]},(decoded)=>{document.getElementById('p').value=decoded;ultima=decoded;document.getElementById('result').innerHTML=plantillaResultado(`✅ CODIGO DETECTADO:<br><br>${decoded}`); saveHist(decoded,decoded);},err=>{}).catch(err=>{document.getElementById('result').innerHTML=`<div class="card">Error camara: ${err}</div>`;});}
function stopQR(){if(html5QrCode){html5QrCode.stop().then(()=>{document.getElementById('reader').innerHTML="";}).catch(()=>{});}}
document.getElementById('file').addEventListener('change', async e=>{const file=e.target.files[0];if(!file) return;const r=document.getElementById('result');r.innerHTML='<div class="card">🔍 Leyendo QR y Texto...</div>';try{html5QrCode=new Html5Qrcode("reader");const decoded=await html5QrCode.scanFile(file,true);document.getElementById('p').value=decoded;ultima=decoded;r.innerHTML=plantillaResultado(`✅ CODIGO DETECTADO:<br><br>${decoded}`);saveHist(decoded,decoded);return;}catch(e){}try{const {data:{text}}=await Tesseract.recognize(file,'spa+eng');document.getElementById('p').value=text.slice(0,300);ultima=text;r.innerHTML=plantillaResultado(`📄 TEXTO EN FOTO:<br><br>${text.slice(0,800)}`);saveHist(text.slice(0,40),text.slice(0,80));}catch(err){r.innerHTML=`<div class="card">Error: ${err.message}</div>`;}});
</script>
</body></html>
