<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>IA BF UNIVERSAL</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{background:#000;color:#fff;font-family:system-ui;display:flex;flex-direction:column;align-items:center;min-height:100vh;padding:20px}
.logo{width:80px;height:80px;border-radius:50%;background:linear-gradient(90deg,#00ff88,#00aaff);display:flex;align-items:center;justify-content:center;font-weight:900;color:#000;font-size:28px;box-shadow:0 0 30px #00ff88;margin:20px 0 10px}
h1{font-size:30px;font-weight:800;background:linear-gradient(90deg,#00ff88,#00aaff);-webkit-background-clip:text;-webkit-text-fill-color:transparent;letter-spacing:1px}
.box{width:100%;max-width:680px;display:flex;gap:8px;margin:25px 0 15px}
input{flex:1;padding:15px 18px;border-radius:14px;border:1px solid #1f1f1f;background:#111;color:#fff;font-size:15px;outline:none}
input:focus{border-color:#00ff88}
button{padding:15px 20px;border-radius:14px;border:0;background:#00ff88;color:#000;font-weight:800;cursor:pointer}
#result{width:100%;max-width:680px;display:grid;gap:12px}
.card{background:#111;border:1px solid #1a1a1a;border-radius:14px;padding:16px;line-height:1.6;font-size:14px;white-space:pre-wrap}
</style>
</head>
<body>
<div class="logo">BF</div>
<h1>IA BF UNIVERSAL</h1>
<div class="box">
<input id="p" placeholder="Pregunta lo que sea..." onkeypress="if(event.key==='Enter') go()">
<button onclick="go()">Responder</button>
</div>
<div id="result"></div>
<script>
async function go(){
 const v=document.getElementById('p').value.trim(); if(!v) return;
 const r=document.getElementById('result'); r.innerHTML='<div class="card">Pensando...</div>';
 const d=await fetch('/api/debate',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({prompt:v})}).then(x=>x.json());
 r.innerHTML=d.x2.map(b=>`<div class="card">${b.respuesta.replace(/\*\*/g,"")}</div>`).join('');
}
</script>
</body>
</html>
