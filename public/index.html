<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>IA BF UNIVERSAL</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{background:#000;color:#fff;font-family:system-ui;display:flex;flex-direction:column;align-items:center;min-height:100vh;padding:20px}
.logo{width:84px;height:84px;border-radius:50%;background:linear-gradient(135deg,#00ff88,#00aaff);display:flex;align-items:center;justify-content:center;color:#000;font-weight:900;font-size:30px;box-shadow:0 0 35px #00ff88;margin:24px 0 12px}
h1{font-size:32px;font-weight:900;background:linear-gradient(90deg,#00ff88,#00aaff);-webkit-background-clip:text;-webkit-text-fill-color:transparent}
.box{width:100%;max-width:700px;display:flex;gap:8px;margin:28px 0 18px}
input{flex:1;padding:16px 18px;border-radius:16px;border:1px solid #222;background:#111;color:#fff;font-size:15px;outline:none}
input:focus{border-color:#00ff88}
button{padding:16px 22px;border-radius:16px;border:0;background:#00ff88;color:#000;font-weight:800;cursor:pointer}
#result{width:100%;max-width:700px;display:grid;gap:12px}
.card{background:#111;border:1px solid #1e1e1e;border-radius:16px;padding:18px;line-height:1.7;font-size:14.5px;white-space:pre-wrap}
</style>
</head>
<body>
<div class="logo">BF</div>
<h1>IA BF UNIVERSAL</h1>
<div class="box">
<input id="p" placeholder="pregunta lo que quieras" onkeypress="if(event.key==='Enter') go()">
<button onclick="go()">Responder</button>
</div>
<div id="result"></div>
<script>
async function go(){
 const v=document.getElementById('p').value.trim(); if(!v) return;
 const r=document.getElementById('result'); r.innerHTML='<div class="card">Pensando...</div>';
 const d=await fetch('/api/debate',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({prompt:v})}).then(x=>x.json());
 const limpio = d.x2[0].respuesta.replace(/\*\*/g,"").replace(/\*/g,"").replace(/#/g,"");
 r.innerHTML=`<div class="card">${limpio}</div>`;
}
</script>
</body>
</html>
