<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>IA BF v3.0 COMPLETA - mas arriba que lo alto</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:system-ui;background:#000;color:#fff;min-height:100vh;display:flex;flex-direction:column;align-items:center;padding:15px}
h1{font-size:32px;background:linear-gradient(90deg,#00ff88,#00aaff);-webkit-background-clip:text;-webkit-text-fill-color:transparent}
.lema{color:#00ff88;font-weight:bold;margin:8px 0 15px}
.tabs{display:flex;gap:8px;margin-bottom:15px;flex-wrap:wrap;justify-content:center}
.tab{padding:10px 18px;border-radius:20px;border:1px solid #333;background:#111;color:#fff;cursor:pointer;font-size:13px}
.tab.active{background:#00ff88;color:#000;border-color:#00ff88;font-weight:bold}
.input-box{width:100%;max-width:700px;display:flex;gap:10px;margin-bottom:15px}
input{flex:1;padding:14px;border-radius:12px;border:1px solid #333;background:#111;color:#fff}
button{padding:14px 20px;border-radius:12px;border:0;background:#00ff88;color:#000;font-weight:bold;cursor:pointer}
#result{width:100%;max-width:700px;display:grid;gap:12px}
.card{background:#111;border:1px solid #222;border-radius:16px;padding:16px}
.card.lider{border-left:4px solid #00ff88}
.card.supremo{border-left:4px solid #00aaff}
.card img{width:100%;border-radius:12px;margin-top:10px}
.footer{margin-top:30px;color:#555;font-size:10px}
</style>
</head>
<body>
<h1>IA BF v3.0</h1>
<div class="lema">COMPLETA - mas arriba que lo alto!</div>
<div class="tabs">
<button class="tab active" onclick="setTab('chat')">💬 Chat x2</button>
<button class="tab" onclick="setTab('imagen')">🎨 Imagen</button>
<button class="tab" onclick="setTab('video')">🎬 Video</button>
<button class="tab" onclick="setTab('voz')">🎤 Herramientas</button>
</div>
<div class="input-box">
<input id="prompt" placeholder="Escribe..." onkeypress="if(event.key==='Enter') ejecutar()">
<button onclick="ejecutar()">Generar</button>
</div>
<div id="result"></div>
<div class="footer">BERNARDO FABIAN VILLEGAS NOLAZCO - BF-LIDER + SUPREMO + IMAGEN + VIDEO - 100% BF</div>
<script>
let modo='chat';
function setTab(m){modo=m; document.querySelectorAll('.tab').forEach(t=>t.classList.remove('active')); event.target.classList.add('active');
 document.getElementById('prompt').placeholder = m==='chat'?'Pregunta a tus 2 cerebros...': m==='imagen'?'Describe imagen: Ej. taco espacial neon': m==='video'?'Describe video: Ej. ciudad futurista BF': 'Ej: traducir, resumir, codigo...';
}
async function ejecutar(){
 const p=document.getElementById('prompt').value.trim(); if(!p) return;
 const resDiv=document.getElementById('result'); resDiv.innerHTML='<div class="card"><p>🧠 IA BF trabajando mas arriba...</p></div>';
 try{
  if(modo==='chat'){
   const r=await fetch('/api/debate',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({prompt:p})});
   const d=await r.json();
   resDiv.innerHTML=(d.x2||[]).map(b=>`<div class="card ${b.cerebro.includes('LIDER')?'lider':'supremo'}"><h3>${b.cerebro}</h3><p>${b.respuesta}</p></div>`).join('');
  } else if(modo==='imagen'){
   const r=await fetch('/api/imagen',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({prompt:p})});
   const d=await r.json();
   resDiv.innerHTML=`<div class="card"><h3>🎨 BF-IMAGEN TURBO</h3><p>${d.prompt}</p><img src="${d.imageUrl}" onload="window.scrollTo(0,document.body.scrollHeight)"><p><a href="${d.imageUrl}" target="_blank" style="color:#00ff88">Abrir imagen HD</a></p></div>`;
  } else if(modo==='video'){
   const r=await fetch('/api/video',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({prompt:p})});
   const d=await r.json();
   if(d.videoUrl){ resDiv.innerHTML=`<div class="card"><h3>🎬 VIDEO REAL BF</h3><video controls src="${d.videoUrl}" style="width:100%;border-radius:12px"></video></div>`; }
   else { resDiv.innerHTML=`<div class="card"><h3>🎬 VIDEO PREVIEW (Gratis)</h3><p>${d.instruccion}</p><img src="${d.previewUrl}"><p style="color:#888;font-size:12px">Para video MP4 real: agrega RUNWAY_API_KEY en Vercel Env Vars. Cuesta $0.05 por segundo.</p></div>`; }
  } else {
   const r=await fetch('/api/completa',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({accion:'general',prompt:p})});
   const d=await r.json();
   resDiv.innerHTML=`<div class="card"><h3>🛠️ BF-HERRAMIENTAS</h3><p>${d.resultado}</p></div>`;
  }
 }catch(e){ resDiv.innerHTML=`<div class="card"><p>Error: ${e.message}</p></div>`; }
}
window.onload=()=>{document.getElementById('prompt').value='Quien eres'; ejecutar();}
</script>
</body>
</html>
